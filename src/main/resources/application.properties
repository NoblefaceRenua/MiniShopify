spring.application.name=mini-shopify

# Defaults match the local database in docker-compose.yml.
# On Azure, DB_URL, DB_USERNAME and DB_PASSWORD are set in App Service environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minishopify}
spring.datasource.username=${DB_USERNAME:minishopify}
spring.datasource.password=${DB_PASSWORD:minishopify}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Drain rejected uploads so clients can receive the HTTP 413 error page.
server.tomcat.max-swallow-size=-1
server.port=${PORT:8080}